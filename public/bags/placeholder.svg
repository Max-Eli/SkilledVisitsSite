<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Artwork coming soon">
  <defs>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9d5fb" />
      <stop offset="100%" stop-color="#d4b3f5" />
    </linearGradient>
  </defs>

  <rect width="900" height="1200" fill="#ffffff" />

  <!-- bag shell -->
  <rect x="196" y="146" width="508" height="852" rx="72" fill="#f7f4fa" stroke="#d8cee2" stroke-width="10" />
  <!-- hanger slot -->
  <rect x="396" y="186" width="108" height="34" rx="17" fill="none" stroke="#d8cee2" stroke-width="10" />
  <!-- fluid panel -->
  <rect x="240" y="258" width="420" height="676" rx="48" fill="url(#bag)" />

  <!-- category chip -->
  <rect x="330" y="318" width="240" height="40" rx="20" fill="#ffffff" opacity="0.6" />

  <!-- label lines -->
  <rect x="300" y="430" width="300" height="26" rx="13" fill="#ffffff" opacity="0.85" />
  <rect x="336" y="484" width="228" height="20" rx="10" fill="#ffffff" opacity="0.6" />

  <g fill="#ffffff" opacity="0.75">
    <rect x="300" y="576" width="300" height="44" rx="22" />
    <rect x="300" y="640" width="300" height="44" rx="22" />
    <rect x="300" y="704" width="300" height="44" rx="22" />
  </g>

  <rect x="300" y="806" width="300" height="18" rx="9" fill="#ffffff" opacity="0.55" />

  <!-- ports -->
  <rect x="368" y="998" width="48" height="72" rx="12" fill="#d8cee2" />
  <rect x="484" y="998" width="48" height="72" rx="12" fill="#d8cee2" />

  <text x="450" y="1136" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="30" font-weight="600" letter-spacing="5" fill="#7029b3">
    ARTWORK COMING SOON
  </text>
</svg>
